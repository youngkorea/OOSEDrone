[General]
*.visualizer.osgVisualizer.typename = ""
*.visualizer.*.mobilityVisualizer.displayRoutes = true
*.visualizer.*.mobilityVisualizer.routeLineColor = "navy"
*.visualizer.*.mobilityVisualizer.routeLineWidth = 2
*.visualizer.*.mobilityVisualizer.routeLineStyle = "dashed" #solid, dashed
*.visualizer.*.mobilityVisualizer.routeTTL = 100s #
network = OOSEDroneNetwork
sim-time-limit = 300s
record-eventlog = false
*.numReceivers = 10

# === Constraint Area for All Nodes ===
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1813m 
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1049m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 500m

# === Ground Station (Stationary) ===
*.groundStation.mobility.typename = "StationaryMobility"
*.groundStation.mobility.initialX = 900m
*.groundStation.mobility.initialY = 950m
*.groundStation.mobility.initialZ = 0m
*.groundStation.mobility.initFromDisplayString = false

# === Drones : TurtleMobility ===
*.senderDrone.mobility.typename = "TurtleMobility"
*.senderDrone.mobility.turtleScript = xmldoc("droneMission.xml")
*.senderDrone.mobility.initFromDisplayString = false

*.senderDrone.mobility.initialX = 600m
*.senderDrone.mobility.initialY = 800m
*.senderDrone.mobility.initialZ = 100m
*.senderDrone.mobility.updateInterval = 0.1s


# === Edge Server (Stationary) ===
*.receiver[*].mobility.typename = "MassMobility" #StationaryMobility
*.receiver[*].mobility.initFromDisplayString = false
*.receiver[*].mobility.initialX = uniform(100m, 1700m) #random coordinates in 100~900m
*.receiver[*].mobility.initialY = uniform(100m, 950m)
*.receiver[*].mobility.initialZ = 0m
*.receiver[*].mobility.changeInterval = 2s
*.receiver[*].mobility.angleDelta = uniform(-30deg, 30deg)
*.receiver[*].mobility.speed = uniform(5mps, 15mps)

# === Radio Medium: IEEE 802.11 ===
*.radioMedium.typename = "Ieee80211ScalarRadioMedium"

# === Wireless Settings ===
*.senderDrone.wlan[0].radio.transmitter.power = 20mW
*.groundStation.wlan[0].radio.transmitter.power = 100mW
*.receiver[*].wlan[0].radio.transmitter.power = 100mW

# === Ad-hoc mode for direct drone-to-drone communication ===
*.senderDrone.wlan[0].mgmt.typename = "Ieee80211MgmtAdhoc"
*.senderDrone.wlan[0].agent.typename = ""
*.receiver[*].wlan[0].mgmt.typename = "Ieee80211MgmtAdhoc"
*.receiver[*].wlan[0].agent.typename = ""
*.groundStation.wlan[0].mgmt.typename = "Ieee80211MgmtAdhoc"
*.groundStation.wlan[0].agent.typename = ""

# === Application Layer (Default traffic generator will be replaced later) ===
*.senderDrone.numApps = 1
*.senderDrone.app[0].typename = "oosedrone.SigncryptApp" # replaced from UdpBasicApp to SigncryptApp
*.senderDrone.app[0].destAddresses = ""
#*.senderDrone.app[0].chooseDestAddrMode = "perBurst" #designate new receiver every time
*.senderDrone.app[0].destPort = 5000
*.senderDrone.app[0].messageLength = 406B   # ciphertext size (coose)
*.senderDrone.app[0].sendInterval = 1s   # 10 msg/sec during burst
*.senderDrone.app[0].schemeType = "AOOSE"
*.senderDrone.app[0].dbSize = 1000
*.senderDrone.app[0].onlineCompTime = 2.504ms

*.receiver[*].numApps = 1
*.receiver[*].app[0].typename = "UdpSink"
*.receiver[*].app[0].localPort = 5000

# === Statistics Recording ===
**.SigncryptApp.retrievalTime.result-recording-modes = +vector,+stats
**.SigncryptApp.totalOnlineTime.result-recording-modes = +vector,+stats
**.SigncryptApp.endToEndDelay.result-recording-modes = +vector,+stats

# === ARP Address Resolution ===
*.configurator.config = xml("<config><interface hosts='**' address='10.x.x.x' netmask='255.0.0.0'/></config>")
*.configurator.addStaticRoutes = true
*.configurator.optimizeRoutes = false

# Use global ARP to avoid resolution failures and find receiver's MAC address
**.arp.typename = "GlobalArp"

# === Repeat each config 4 times with different seeds ===
repeat = 4
seed-set = ${repetition}


# ============================================================
# DB sizes: 10, 100, 200, 400, 600, 1000
# offSigncryptTime = per-token OffSigncrypt time (ms)
# onlineCompTime = OnSigncrypt time (ms)
